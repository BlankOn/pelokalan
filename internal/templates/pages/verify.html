{{define "content"}}
<div class="auth-card">
    <h1>{{t .Lang "auth.verify_title"}}</h1>
    <p class="muted">{{t .Lang "auth.verify_intro" .Data.Email .Data.Minutes}}</p>
    <form method="post" action="/verify" class="form">
        <input type="hidden" name="email" value="{{.Data.Email}}">
        <input type="hidden" name="purpose" value="{{.Data.Purpose}}">
        <input type="hidden" name="next" value="{{.Data.Next}}">
        <label for="code">{{t .Lang "field.code"}}</label>
        <input id="code" class="otp-input" type="text" name="code" required autofocus
               inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="••••••">
        <button type="submit" class="btn btn-primary btn-block">{{t .Lang "auth.verify_button"}}</button>
    </form>
    {{template "resend_form" .Data.Resend}}
    <p class="auth-alt"><a href="/{{if eq .Data.Purpose "register"}}register{{else}}login{{end}}">{{t .Lang "auth.use_other_email"}}</a></p>
</div>
{{end}}
