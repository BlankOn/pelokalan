{{define "content"}}
<div class="auth-card">
    <h1>{{t .Lang "auth.login_title"}}</h1>
    <p class="muted">{{t .Lang "auth.login_intro"}}</p>
    <form method="post" action="/login" class="form">
        <input type="hidden" name="next" value="{{.Data.Next}}">
        <label for="email">{{t .Lang "field.email"}}</label>
        <input id="email" type="email" name="email" value="{{.Data.Email}}" required autofocus autocomplete="email" placeholder="nama@contoh.id">
        <button type="submit" class="btn btn-primary btn-block">{{t .Lang "auth.send_code"}}</button>
    </form>
    {{if .Data.NoAccount}}
    <p class="auth-alt"><a class="btn btn-block" href="/register?email={{.Data.Email}}&amp;next={{.Data.Next}}">{{t .Lang "auth.create_account"}}</a></p>
    {{end}}
    <p class="auth-alt">{{t .Lang "auth.no_account"}} <a href="/register?next={{.Data.Next}}">{{t .Lang "auth.register_link"}}</a></p>
    {{if .Data.WhitelistOn}}<p class="muted small">{{t .Lang "auth.whitelist_note"}}</p>{{end}}
</div>
{{end}}
