{{/* Badge medals (profile page and share page): an earned medal has a tier-coloured rim, a shaded face and a white icon;
     an unearned one is an empty dashed slot. Colours match badgecard.Tiers (the share image). */}}
{{define "medal_defs"}}<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="mg-bronze" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#f3c39a"/><stop offset=".35" stop-color="#d98c4e"/><stop offset="1" stop-color="#a45a24"/></linearGradient><linearGradient id="mg-silver" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#c4d3e6"/><stop offset="1" stop-color="#7f93ad"/></linearGradient><linearGradient id="mg-gold" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".35" stop-color="#f2c443"/><stop offset="1" stop-color="#c08a0a"/></linearGradient><linearGradient id="mg-platinum" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#e3fbfd"/><stop offset=".35" stop-color="#8fd6dc"/><stop offset="1" stop-color="#2f8f9a"/></linearGradient><linearGradient id="mg-diamond" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#eee7ff"/><stop offset=".35" stop-color="#b9a4f5"/><stop offset="1" stop-color="#6440c9"/></linearGradient></defs></svg>{{end}}
{{define "badge_medal"}}<svg class="badge-medal" viewBox="0 0 56 62" aria-hidden="true">
<polygon class="m-rim" points="28.0,2.0 4.6,16.5 4.6,45.5 28.0,60.0 51.4,45.5 51.4,16.5"/><polygon class="m-face"{{if .TierName}} fill="url(#mg-{{.TierName}})"{{end}} points="28.0,5.5 7.5,18.2 7.5,43.7 28.0,56.5 48.5,43.8 48.5,18.2"/>{{if .TierName}}<polygon class="m-bevel" points="28.0,6.7 8.4,18.8 8.4,43.1 28.0,55.3 47.6,43.2 47.6,18.9"/>{{end}}
<g class="m-icon" transform="translate(16 19)">{{badgeIcon .Icon}}</g></svg>{{end}}
